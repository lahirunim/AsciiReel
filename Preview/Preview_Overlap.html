<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Player</title>
<link id="googleFontsLink" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#eee;font-family:ui-monospace,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center}
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:#0f0f0f;border-bottom:1px solid #1e1e1e;padding:8px 12px 0 12px;display:flex;flex-direction:column;gap:8px}
#loadbar{width:100%;height:2px;background:#1a1a1a;overflow:hidden}#loadbar div{height:100%;width:0%;background:#fff;transition:width .12s linear}
#controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:8px}
#controls button{background:#fff;color:#000;border:0;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer}
#controls label{display:flex;align-items:center;gap:5px;font-size:12px;background:#000;padding:4px 7px;border:1px solid #1e1e1e;white-space:nowrap}
#controls input[type="range"]{width:60px;accent-color:#fff}
#controls input[type="color"]{width:18px;height:16px;border:0;background:none;cursor:pointer}
#controls input.hex{width:56px;background:#0a0a0a;color:#eee;border:1px solid #2a2a2a;font-size:11px;padding:2px 4px;font-family:inherit}
#controls select{background:#000;color:#eee;border:1px solid #2a2a2a;font-size:12px;padding:2px 4px;font-family:inherit;min-width:140px}
#stage{margin-top:72px;padding:16px;width:100%;max-width:1400px;display:flex;justify-content:center}
#screens{position:relative;display:inline-block;padding:10px;border:1px solid #2a2a2a;box-shadow:0 0 0 1px #111;max-width:100%;line-height:.85}
#screen{position:relative;background:transparent;color:#fff;line-height:.85;font-size:12px;white-space:pre;border:0;padding:0;margin:0;overflow:hidden}
#screen2{position:absolute;top:10px;left:10px;right:10px;bottom:10px;background:transparent;color:#fff;line-height:.85;font-size:12px;white-space:pre;border:0;padding:0;margin:0;overflow:hidden;pointer-events:none}
</style>
<script>
// ===== DUAL DATA LOADER =====
// video_data.js and video_data_2.js are each loaded inside their own hidden
// iframe so their globals (W,H,CHARS,FRAMES) can never collide with each other.
window.__RAWDATA = {1:undefined, 2:undefined};
window.__didInit = false;
window.__asciiGotData = function(n, d){
  if(window.__didInit) return;
  if(window.__RAWDATA[n]===undefined) window.__RAWDATA[n] = d||null;
  if(window.__RAWDATA[1]!==undefined && window.__RAWDATA[2]!==undefined){
    window.__didInit = true;
    if(typeof init==='function') init();
  }
};
// fallback: if the iframes never report back, init anyway so errors show
setTimeout(function(){
  if(!window.__didInit){ window.__didInit = true; if(typeof init==='function') init(); }
}, 5000);
</script>
</head>
<body>

<div id="topbar">
  <div id="loadbar"><div id="loadFill"></div></div>
  <div id="controls">
    <button id="playBtn">PAUSE</button>
    <label>FPS <input id="fps" type="range" min="1" max="60" value="12"><span id="fpsVal">12</span></label>
    <label>SIZE <input id="size" type="range" min="1" max="32" value="12"><span id="sizeVal">12</span></label>
    <label>LINE-H <input id="lineH" type="range" min="0.1" max="2" step="0.05" value="0.9"><span id="lineHVal">0.9</span></label>
    <label>FONT <select id="fontFamily"></select></label>
    <label><input id="bold" type="checkbox"> BOLD</label>
    <label>TEXT 1 <input id="fontColor" type="color" value="#ffffff"><input id="fontColorHex" class="hex" type="text" value="#ffffff" maxlength="7" spellcheck="false"></label>
    <label>TEXT 2 <input id="fontColor2" type="color" value="#ffffff"><input id="fontColor2Hex" class="hex" type="text" value="#ffffff" maxlength="7" spellcheck="false"></label>
    <label>BG <input id="bgColor" type="color" value="#000000"><input id="bgColorHex" class="hex" type="text" value="#000000" maxlength="7" spellcheck="false"></label>
    <label><input id="invert" type="checkbox"> INVERT</label>
    <label><input id="loop" type="checkbox" checked> LOOP</label>
  </div>
</div>

<div id="stage"><div id="screens"><pre id="screen">Loading video_data.js + video_data_2.js...</pre><pre id="screen2"></pre></div></div>

<iframe id="dataFrame1" style="display:none" srcdoc="<script src='video_data.js'></script><script>function s(){try{var ok=typeof FRAMES!=='undefined'&&typeof W!=='undefined'&&typeof H!=='undefined'&&typeof CHARS!=='undefined';parent.__asciiGotData(1,ok?{W:W,H:H,CHARS:CHARS,FRAMES:FRAMES}:null);}catch(e){setTimeout(s,100);}}s();</script>"></iframe>
<iframe id="dataFrame2" style="display:none" srcdoc="<script src='video_data_2.js'></script><script>function s(){try{var ok=typeof FRAMES!=='undefined'&&typeof W!=='undefined'&&typeof H!=='undefined'&&typeof CHARS!=='undefined';parent.__asciiGotData(2,ok?{W:W,H:H,CHARS:CHARS,FRAMES:FRAMES}:null);}catch(e){setTimeout(s,100);}}s();</script>"></iframe>

<script src="animation.js"></script>
<script>
// ========== FONT CONFIG - EASY TO ADD MORE ==========
// ONLINE = loaded from Google Fonts (needs internet)
const ONLINE_FONTS = [
  { label: "Courier Prime", value: "'Courier Prime', monospace" },
  { label: "IBM Plex Mono", value: "'IBM Plex Mono', monospace" },
  { label: "JetBrains Mono", value: "'JetBrains Mono', monospace" },
  { label: "Fira Code", value: "'Fira Code', monospace" },
  { label: "VT323", value: "'VT323', monospace" },
  { label: "Roboto Mono", value: "'Roboto Mono', monospace" },
  { label: "Source Code Pro", value: "'Source Code Pro', monospace" },
  // ADD MORE ONLINE HERE: { label: "Space Mono", value: "'Space Mono', monospace" },
];

// OFFLINE = system/local fonts (no internet needed)
const OFFLINE_FONTS = [
  { label: "Courier New", value: "'Courier New', monospace" },
  { label: "Consolas", value: "Consolas, monospace" },
  { label: "Monaco", value: "Monaco, monospace" },
  { label: "Lucida Console", value: "'Lucida Console', monospace" },
  { label: "ui-monospace", value: "ui-monospace, monospace" },
  // ADD MORE OFFLINE HERE: { label: "DejaVu Sans Mono", value: "'DejaVu Sans Mono', monospace" },
];

// Google Fonts URL that loads all ONLINE fonts above
// If you add a new ONLINE font, also add it to this URL: https://fonts.google.com -> select font -> copy link
const GOOGLE_FONTS_URL = "https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=Roboto+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700&family=VT323&display=swap";
// ======================================================

// CODE CONTROL
const CONFIG = {
  FPS: 12, SIZE: 12, FONT: "'Courier Prime', monospace", BOLD: false,
  TEXT_COLOR: "#ffffff", TEXT2_COLOR: "#ffffff", BG_COLOR: "#000000", INVERT: false, LOOP: true,
  LINE_HEIGHT: 0.9, LETTER_SPACING: "0px"
};

const el = {
  screen: document.getElementById('screen'),
  screen2: document.getElementById('screen2'),
  box: document.getElementById('screens'),
  playBtn: document.getElementById('playBtn'),
  fps: document.getElementById('fps'), fpsVal: document.getElementById('fpsVal'),
  size: document.getElementById('size'), sizeVal: document.getElementById('sizeVal'),
  font: document.getElementById('fontFamily'), bold: document.getElementById('bold'),
  textColor: document.getElementById('fontColor'), bgColor: document.getElementById('bgColor'),
  textColorHex: document.getElementById('fontColorHex'), bgColorHex: document.getElementById('bgColorHex'),
  textColor2: document.getElementById('fontColor2'), textColor2Hex: document.getElementById('fontColor2Hex'),
  invert: document.getElementById('invert'), loop: document.getElementById('loop'),
  lineH: document.getElementById('lineH'), lineHVal: document.getElementById('lineHVal'),
  loadFill: document.getElementById('loadFill')
};

function populateFonts(){
  el.font.innerHTML = "";
  const onlineGroup = document.createElement('optgroup');
  onlineGroup.label = "ONLINE - from web (needs internet)";
  ONLINE_FONTS.forEach(f=>{
    const opt = document.createElement('option');
    opt.value = f.value;
    opt.textContent = `[ONLINE] ${f.label}`;
    onlineGroup.appendChild(opt);
  });
  el.font.appendChild(onlineGroup);

  const offlineGroup = document.createElement('optgroup');
  offlineGroup.label = "OFFLINE - local/system (no internet)";
  OFFLINE_FONTS.forEach(f=>{
    const opt = document.createElement('option');
    opt.value = f.value;
    opt.textContent = `[OFFLINE] ${f.label}`;
    offlineGroup.appendChild(opt);
  });
  el.font.appendChild(offlineGroup);
}

let L1=null, L2=null, masterIdx=0, playing=true, timer=null, curFps=CONFIG.FPS;

// missing W/H/CHARS in a data file can fall back to page globals (e.g. from animation.js)
function fillDims(d){
  const g=(v,name)=>(typeof v!=='undefined')?v:((typeof window[name]!=='undefined')?window[name]:undefined);
  return {W:g(d.W,'W'), H:g(d.H,'H'), CHARS:g(d.CHARS,'CHARS'), FRAMES:d.FRAMES};
}
function validDims(d){
  return d && typeof d.W==='number' && typeof d.H==='number' &&
         typeof d.CHARS==='string' && Array.isArray(d.FRAMES) && d.FRAMES.length>0;
}
function mkLayer(d){ return {W:d.W, H:d.H, CHARS:d.CHARS, FRAMES:d.FRAMES, buf:d.FRAMES[0].split(''), idx:1}; }
function setScreens(prop,val){ el.screen.style[prop]=val; el.screen2.style[prop]=val; }

function init(){
  populateFonts();
  document.getElementById('googleFontsLink').href = GOOGLE_FONTS_URL;

  const raw1=window.__RAWDATA[1], raw2=window.__RAWDATA[2];
  if(!raw1){el.screen.textContent='video_data.js not found - run VidASCII.py';return;}
  if(!raw2){el.screen.textContent='video_data_2.js not found - run VidASCII.py';return;}
  const D1=fillDims(raw1), D2=fillDims(raw2);
  if(!validDims(D1)){el.screen.textContent='video_data.js is incomplete (needs W, H, CHARS, FRAMES) - re-run VidASCII.py';return;}
  if(!validDims(D2)){el.screen.textContent='video_data_2.js is incomplete (needs W, H, CHARS, FRAMES) - re-run VidASCII.py';return;}
  L1=mkLayer(D1); L2=mkLayer(D2); masterIdx=0;
  el.fps.value=CONFIG.FPS; el.fpsVal.textContent=CONFIG.FPS;
  el.size.value=CONFIG.SIZE; el.sizeVal.textContent=CONFIG.SIZE;
  el.font.value=CONFIG.FONT; el.bold.checked=CONFIG.BOLD;
  el.textColor.value=CONFIG.TEXT_COLOR; el.bgColor.value=CONFIG.BG_COLOR;
  el.textColorHex.value=CONFIG.TEXT_COLOR; el.bgColorHex.value=CONFIG.BG_COLOR;
  el.textColor2.value=CONFIG.TEXT2_COLOR; el.textColor2Hex.value=CONFIG.TEXT2_COLOR;
  el.invert.checked=CONFIG.INVERT; el.loop.checked=CONFIG.LOOP;
  el.lineH.value=CONFIG.LINE_HEIGHT; el.lineHVal.textContent=CONFIG.LINE_HEIGHT;
  curFps=CONFIG.FPS;
  setScreens('fontSize',CONFIG.SIZE+'px');
  setScreens('fontFamily',CONFIG.FONT);
  setScreens('fontWeight',CONFIG.BOLD?'700':'400');
  el.screen.style.color=CONFIG.TEXT_COLOR;    // video_data.js (bottom)
  el.screen2.style.color=CONFIG.TEXT2_COLOR;   // video_data_2.js (top)
  el.box.style.background=CONFIG.BG_COLOR;
  setScreens('lineHeight',CONFIG.LINE_HEIGHT);
  setScreens('letterSpacing',CONFIG.LETTER_SPACING);
  renderLayers(); play();
}
// ===== OVERLAP: video_data_2.js on top of video_data.js, aligned =====
// sparse block-shade sheet over the detailed sheet — both visible, like paper
function renderLayers(){
  const CW=Math.max(L1.W,L2.W), CH=Math.max(L1.H,L2.H);
  const ox1=(CW-L1.W)>>1, oy1=(CH-L1.H)>>1;
  const ox2=(CW-L2.W)>>1, oy2=(CH-L2.H)>>1;
  let outBase='', outTop='';
  for(let y=0;y<CH;y++){
    for(let x=0;x<CW;x++){
      let cb=' ', ct=' ';
      const x1=x-ox1, y1=y-oy1;
      if(x1>=0&&y1>=0&&x1<L1.W&&y1<L1.H) cb=L1.buf[y1*L1.W+x1]; // video_data.js full
      const x2=x-ox2, y2=y-oy2;
      if(x2>=0&&y2>=0&&x2<L2.W&&y2<L2.H){
        const t=L2.buf[y2*L2.W+x2];
        if(t!==' ') ct=t; // video_data_2.js: only spaces are see-through
      }
      outBase+=cb; outTop+=ct;
    }
    outBase+='\n'; outTop+='\n';
  }
  el.screen.textContent=outBase;   // video_data.js (bottom sheet)
  el.screen2.textContent=outTop;   // video_data_2.js (top sheet)
  const maxLen=Math.max(L1.FRAMES.length,L2.FRAMES.length);
  el.loadFill.style.width=((masterIdx%Math.max(1,maxLen))/Math.max(1,maxLen-1)*100)+'%';
}
function applyDiff(d,L){
  const buf=L.buf, CH=L.CHARS;
  for(let dd of d){
    if(dd.length===2){let[p,c]=dd;if(p>=0&&p<buf.length)buf[p]=CH[c]||' ';}
    else if(dd.length===3){let[p,r,c]=dd,ch=CH[c]||' ';for(let i=0;i<r;i++){let pp=p+i;if(pp>=0&&pp<buf.length)buf[pp]=ch;}}
  }
}
function stepLayer(L){
  if(L.idx>=L.FRAMES.length){
    if(el.loop.checked){L.buf=L.FRAMES[0].split('');L.idx=1;}
  }else{
    if(L.idx>0)applyDiff(L.FRAMES[L.idx],L);
    L.idx++;
  }
}
function nextFrame(){
  const maxLen=Math.max(L1.FRAMES.length,L2.FRAMES.length);
  if(!el.loop.checked&&masterIdx>=maxLen-1){pause();return;}
  stepLayer(L1); stepLayer(L2);
  renderLayers();
  masterIdx++;
}
function play(){if(timer)clearInterval(timer);playing=true;el.playBtn.textContent='PAUSE';timer=setInterval(nextFrame,1000/curFps);}
function pause(){if(timer)clearInterval(timer);playing=false;el.playBtn.textContent='PLAY';}

el.playBtn.onclick=()=>playing?pause():play();
el.fps.oninput=e=>{curFps=parseFloat(e.target.value);el.fpsVal.textContent=curFps;if(playing){clearInterval(timer);timer=setInterval(nextFrame,1000/curFps);}};
el.size.oninput=e=>{setScreens('fontSize',e.target.value+'px');el.sizeVal.textContent=e.target.value;};
el.font.onchange=e=>{setScreens('fontFamily',e.target.value);};
el.bold.onchange=e=>{setScreens('fontWeight',e.target.checked?'700':'400');};
function hexOK(v){return /^#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.test(v.trim());}
el.textColor.oninput=e=>{el.screen.style.color=e.target.value;el.textColorHex.value=e.target.value;};
el.textColorHex.oninput=e=>{const v=e.target.value.trim();if(hexOK(v)){el.textColor.value=v;el.screen.style.color=el.textColor.value;}};
el.textColor2.oninput=e=>{el.screen2.style.color=e.target.value;el.textColor2Hex.value=e.target.value;};
el.textColor2Hex.oninput=e=>{const v=e.target.value.trim();if(hexOK(v)){el.textColor2.value=v;el.screen2.style.color=el.textColor2.value;}};
el.bgColor.oninput=e=>{el.box.style.background=e.target.value;el.bgColorHex.value=e.target.value;};
el.bgColorHex.oninput=e=>{const v=e.target.value.trim();if(hexOK(v)){el.bgColor.value=v;el.box.style.background=el.bgColor.value;}};
el.invert.onchange=e=>{if(e.target.checked){const b=el.bgColor.value;el.box.style.background=el.textColor.value;el.screen.style.color=b;el.screen2.style.color=b;}else{el.box.style.background=el.bgColor.value;el.screen.style.color=el.textColor.value;el.screen2.style.color=el.textColor2.value;}};
el.lineH.oninput=e=>{setScreens('lineHeight',e.target.value);el.lineHVal.textContent=e.target.value;};

init();
</script>
</body>
</html>
